name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,build]"
      - name: Tests
        run: python -m pytest
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean OZPriceAnalyzer.spec
      - name: Create distribution
        run: python scripts/create_distribution.py
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "release\OZPriceAnalyzer\OZPriceAnalyzer.exe"
          if (-not (Test-Path $exe)) { throw "OZPriceAnalyzer.exe was not created" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "Executable is unexpectedly small: $size" }
          Write-Host "Executable size: $size bytes"
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "release\OZPriceAnalyzer\*" -DestinationPath "release\OZPriceAnalyzer-Windows.zip" -Force
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OZPriceAnalyzer-Windows
          path: release/OZPriceAnalyzer-Windows.zip
          if-no-files-found: error
          retention-days: 30
